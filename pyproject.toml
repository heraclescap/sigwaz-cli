[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sigwaz"
version = "1.0.0"
description = "Sigma to Wazuh XML rule converter — CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["sigma", "wazuh", "siem", "detection", "converter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "ruamel.yaml>=0.18.6",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.scripts]
sigwaz = "sigwaz.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/sigwaz-cli"
Issues   = "https://github.com/your-org/sigwaz-cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sigwaz*"]

[tool.ruff]
line-length = 100
target-version = "py311"
